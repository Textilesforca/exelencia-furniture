name: Mantener Supabase activo

on:
  schedule:
    # Dos veces al día — el proyecto gratuito de Supabase se pausa tras 7
    # días sin actividad. Los cron de GitHub Actions no tienen horario
    # garantizado (se pueden retrasar o saltar una corrida bajo carga alta),
    # así que con solo una corrida cada varios días un salto ya es
    # suficiente para llegar al límite. Corriendo 2 veces al día queda
    # mucho margen aunque falle alguna.
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/productos?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Respuesta de Supabase: $codigo"
          if [ "$codigo" -ge 400 ]; then
            echo "Supabase respondió con error $codigo"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
