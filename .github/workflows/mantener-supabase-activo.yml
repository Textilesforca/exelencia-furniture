name: Mantener Supabase activo

on:
  schedule:
    # Cada 4 días a las 12:00 UTC — el proyecto gratuito de Supabase se
    # pausa tras 7 días sin actividad, esto evita que llegue a ese límite.
    - cron: '0 12 */4 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/productos?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Respuesta de Supabase: $codigo"
          if [ "$codigo" -ge 400 ]; then
            echo "Supabase respondió con error $codigo"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
